<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PSBKAV5 – PSBKAV5 – Q12</title>
  <style>
body {
    font-family: Arial, sans-serif;
    background-color: #f4f6f9;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    margin: 0;
    padding: 28px 16px;
    box-sizing: border-box;
}
.container {
    background: #fff;
    border-radius: 12px;
    padding: 40px 44px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    max-width: 740px;
    width: 100%;
}
.header {
    font-size: 12px;
    font-weight: 700;
    color: #999;
    letter-spacing: .07em;
    text-transform: uppercase;
    margin-bottom: 18px;
}
.question {
    font-size: 16px;
    line-height: 1.75;
    color: #1a1a1a;
    margin-bottom: 28px;
}
.note {
    font-size: 13px;
    color: #888;
    font-style: italic;
    margin-top: 4px;
}
.btn {
    background: #0066ff;
    color: #fff;
    border: none;
    padding: 9px 20px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    transition: background .15s;
}
.btn:hover  { background: #004ecc; }
.btn:disabled { background: #bbb; cursor: default; pointer-events: none; }
.btn-ghost {
    background: #f0f4ff;
    color: #0066ff;
    border: 1.5px solid #cce0ff;
}
.btn-ghost:hover { background: #ddeaff; }
.btn-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 22px;
    align-items: center;
}
#feedback {
    margin-top: 14px;
    font-size: 15px;
    font-weight: 700;
    min-height: 22px;
}
.correct   { color: #1b7a2a; }
.incorrect { color: #c0250a; }
#hintDisplay {
    display: none;
    margin-top: 14px;
    font-style: italic;
    color: #555;
    font-size: 14px;
    line-height: 1.6;
    background: #f7faff;
    border-left: 3px solid #99c2ff;
    padding: 10px 14px;
    border-radius: 0 5px 5px 0;
}
#nextButton { display: none; }
.option-label {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin: 5px 0;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1.5px solid transparent;
    cursor: pointer;
    font-size: 15px;
    line-height: 1.5;
    transition: background .1s, border-color .1s;
}
.option-label:hover { background: #f0f6ff; border-color: #cce0ff; }
.option-label input { margin-top: 3px; flex-shrink: 0; }
.text-row {
    display: flex;
    align-items: center;
    gap: 12px;
}
#answer {
    flex: 1;
    border: none;
    border-bottom: 2px solid #ccc;
    padding: 8px 2px;
    font-size: 16px;
    outline: none;
    background: transparent;
    transition: border-color .15s;
}
#answer:focus { border-bottom-color: #0066ff; }

.progress { font-size: 13px; color: #555; font-weight: 600; margin: -6px 0 14px; }
.opt-letter { font-weight: 700; min-width: 1.4em; }
#hintDisplay { white-space: pre-wrap; }
#hintDisplay .hint-item + .hint-item { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #c8d8f0; }
#answerDisplay { display: none; margin-top: 14px; padding: 10px 14px; border-radius: 0 5px 5px 0;
    background: #eefaf0; border-left: 4px solid #1b7a2a; color: #134d1c; font-size: 14px; font-weight: 600; white-space: pre-wrap; }
#hintBtn:disabled { background: #e4e4e4; color: #999; border-color: #d0d0d0; cursor: not-allowed; }
</style>
</head>
<body>
<div class="container">
  <div class="header">PSBKAV5 – PSBKAV5 – Q12</div>
  <div class="progress">Question 12 of 13</div>
  <div class="question">Question 11 of 12:<br><br>Let's try with a different set of parameters and see how it impacts the AUC ROC. Change the parameters like as below. What did you get?<br><br>Provide your answer in three decimal places.<br><br>L0 = 0.3<br>t = 0.1<br>s = 0.4<br>g = 0.4</div>
  <div class="text-row">
    <input type="text" id="answer" placeholder="Your answer" autocomplete="off">
    <button class="btn" id="submitBtn" onclick="checkAnswer()">Submit</button>
  </div>
  <div id="feedback"></div>
  <div id="hintDisplay"></div>
  <div id="answerDisplay"></div>
  <div class="btn-row">
    <button class="btn btn-ghost" id="hintBtn" onclick="showHint()">Show Hint</button>
    <a class="btn" id="nextButton" href="CPSB-PSBKAV5-Q13-ndef.html">Next &rarr;</a>
  </div>
</div>
<script>
  var hints = ["Assign the new values to the parameters.\n\nL0 = 0.3\nt = 0.1\ns = 0.4\ng = 0.4", "Suppose that you're working on a copy called df5. We want to rerun the formula for this dataframe.\n\nfor index, row in df.iterrows():\ndf5.loc[df5[\"Student\"] != df5[\"Student\"].shift(), \"P(Ln-1)\"] = L0\ndf5.loc[df5[\"Student\"] == df5[\"Student\"].shift(), \"P(Ln-1)\"] = df5[\"P(Ln)\"].shift()\ndf5.loc[df5[\"right\"] == 1, \"P(Ln-1|Result)\"] = df5.loc[:, \"P(Ln-1)\"]*(1-s)/((df5.loc[:, \"P(Ln-1)\"]*(1-s)) + (1-df5.loc[:, \"P(Ln-1)\"])*g)\ndf5.loc[df5[\"right\"] != 1, \"P(Ln-1|Result)\"] = df5.loc[:, \"P(Ln-1)\"]*s/((df5.loc[:, \"P(Ln-1)\"]*s) + (1-df5.loc[:, \"P(Ln-1)\"])*(1-g))\ndf5.loc[:, \"P(Ln)\"] = df5.loc[:, \"P(Ln-1|Result)\"] + (1-df5.loc[:, \"P(Ln-1|Result)\"])*t", "Set the ground truths and the predicted probabilities.\n\ntrue_labels = list(df5[\"right\"])\n\npredicted_probabilities = list(df5[\"P(Ln-1)\"])", "Now, you just need to compute the AUC ROC.\n\nauc_roc2 = roc_auc_score(true_labels, predicted_probabilities)\n\nprint(\"AUC ROC:\", auc_roc2)", "The answer is: 0.578"];
  var hintIndex = 0;
  var correctAnswers = ["0.578", "0.579"];

  // Lenient comparison: case-insensitive, trims, collapses whitespace, and
  // ignores surrounding punctuation so long sentence answers match the hint text.
  function norm(s) {
    return String(s).toLowerCase()
      .replace(/[‘’]/g, "'").replace(/[“”]/g, '"')
      .replace(/[.,;:!?"'()\[\]]/g, ' ')
      .replace(/\s+/g, ' ').trim();
  }

  document.getElementById('answer').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); checkAnswer(); }
  });


  function checkAnswer() {
    var ans = document.getElementById('answer').value.trim();
    if (!ans) return;
    var fb = document.getElementById('feedback');
    if (correctAnswers.map(norm).indexOf(norm(ans)) !== -1) {
      fb.innerHTML = '&#10003; Correct!';
      fb.className = 'feedback correct';
      document.getElementById('answer').disabled = true;
      document.getElementById('submitBtn').disabled = true;
      document.getElementById('hintBtn').style.display = 'none';
      document.getElementById('hintDisplay').style.display = 'none';
      document.getElementById('answerDisplay').style.display = 'none';
      document.getElementById('nextButton').style.display = 'inline-block';
    } else {
      fb.innerHTML = '&#10007; Incorrect — try again.';
      fb.className = 'feedback incorrect';
    }
  }
  // ---- hint / answer reveal ----
  var ANSWER_RE = /^(The answer is|The correct answers are|The correct answer is)\s*:/i;
  var hintSteps = hints.filter(function(h) { return !ANSWER_RE.test(h); });
  var answerText = hints.filter(function(h) { return ANSWER_RE.test(h); }).pop() || null;
  function updateHintBtn() {
    var b = document.getElementById('hintBtn');
    if (!b) return;
    if (hintIndex < hintSteps.length) {
      b.textContent = 'Show Hint (' + (hintIndex + 1) + ' of ' + hintSteps.length + ')';
      b.disabled = false;
    } else if (answerText && hintIndex === hintSteps.length) {
      b.textContent = 'Reveal Answer';
      b.disabled = false;
    } else {
      b.textContent = (hintSteps.length || answerText) ? 'No more hints' : 'No hints available';
      b.disabled = true;
    }
  }
  function showHint() {
    if (hintIndex < hintSteps.length) {
      var d = document.getElementById('hintDisplay');
      var item = document.createElement('div');
      item.className = 'hint-item';
      item.textContent = 'Hint ' + (hintIndex + 1) + ': ' + hintSteps[hintIndex];
      d.appendChild(item);
      d.style.display = 'block';
      hintIndex++;
    } else if (answerText && hintIndex === hintSteps.length) {
      if (!confirm('This will reveal the correct answer. Continue?')) return;
      var a = document.getElementById('answerDisplay');
      a.textContent = answerText.replace(ANSWER_RE, function(m) { return m.replace(/\s*:$/, '') + ': '; }).replace(/:\s+/, ': ');
      a.style.display = 'block';
      hintIndex++;
    }
    updateHintBtn();
  }
  updateHintBtn();
</script>
<!-- ux-v2 -->
</body>
</html>
